name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (defaults to "Snapr v<version>")
        required: false
        default: ""

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf=$conf package=$pkg cargo=$cargo"
          [ "$conf" = "$pkg" ] && [ "$conf" = "$cargo" ]
          if gh release view "v$conf" -R quanvudev/snapr-releases >/dev/null 2>&1; then
            echo "v$conf is already released on quanvudev/snapr-releases"
            exit 1
          fi
          echo "tag=v$conf" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bunx tauri
          owner: quanvudev
          repo: snapr-releases
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Snapr ${{ steps.version.outputs.tag }}
          releaseBody: ${{ inputs.notes || format('Snapr {0}', steps.version.outputs.tag) }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          releaseCommitish: main

      - name: Publish exe and Scoop manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          exe="Snapr_${version}_x64.exe"
          cp src-tauri/target/release/snapr-v2.exe "$exe"
          bun run tauri signer sign "$exe"
          gh release upload "$TAG" "$exe" "$exe.sig" -R quanvudev/snapr-releases
          bun scripts/scoop.ts "$version" "$exe"
