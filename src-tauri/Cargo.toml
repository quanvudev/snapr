[package]
name = "snapr-v2"
version = "2.5.0"
description = "Snapr: Windows tray screenshot and screen recording app"
authors = ["Jun <vhquan9998@gmail.com>"]
edition = "2024"
license = "MIT"
homepage = "https://github.com/quanvudev/snapr"
repository = "https://github.com/quanvudev/snapr"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snapr_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.3"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
toml = "1.1.8"
winit = "0.30"
softbuffer = "0.4"
xcap = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows-capture = "2"
cpal = "0.18"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Media_Transcoding", "Media_Editing", "Media_MediaProperties", "Storage", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Graphics_Dxgi"] }
tauri-plugin-notification = "2"
windows-core = "0.100"
windows-future = "0.3.2"
gif = "0.14.2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
tiny-skia = "0.12.0"
ab_glyph = "0.2.32"
rqrr = "0.11.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "directml", "cuda", "half"] }
half = "2"
regex = "1.13"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
ndarray = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
yaml-rust2 = { version = "0.13", default-features = false }
minisign-verify = "0.3"
semver = "1"
base64 = "0.22"
serde_json = "1"
nnnoiseless = { version = "0.5.2", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }
