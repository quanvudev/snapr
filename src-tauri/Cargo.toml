[package]
name = "snapr-v2"
version = "1.4.0"
description = "Snapr: Windows tray screenshot and screen recording app"
authors = ["Jun <vhquan9998@gmail.com>"]
edition = "2024"
homepage = "https://github.com/quanvudev/snapr"
repository = "https://github.com/quanvudev/snapr"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snapr_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.3"
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
toml = "1.1.8"
winit = "0.30"
softbuffer = "0.4"
xcap = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows-capture = "2"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi"] }
tauri-plugin-notification = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
tiny-skia = "0.12.0"
ab_glyph = "0.2.32"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
